<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No creator profile</title>

    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh;
           margin: 0; background: #f8fafc; color: #334155; text-align: center; }
    a { color: #4f46e5; }

  </div>
</body>
</html>
